<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Container Pill Badges (3 overlapping tabs/containers) -->
  <rect x="22" y="24" width="84" height="22" rx="6" fill="#3b82f6" opacity="0.95"/>
  <rect x="22" y="52" width="84" height="22" rx="6" fill="#10b981" opacity="0.95"/>
  <rect x="22" y="80" width="84" height="22" rx="6" fill="#f59e0b" opacity="0.95"/>

  <!-- Tab indicator lines inside pills -->
  <circle cx="34" cy="35" r="4" fill="#ffffff"/>
  <rect x="44" y="32" width="36" height="6" rx="3" fill="#ffffff" opacity="0.9"/>

  <circle cx="34" cy="63" r="4" fill="#ffffff"/>
  <rect x="44" y="60" width="48" height="6" rx="3" fill="#ffffff" opacity="0.9"/>

  <circle cx="34" cy="91" r="4" fill="#ffffff"/>
  <rect x="44" y="88" width="28" height="6" rx="3" fill="#ffffff" opacity="0.9"/>

  <!-- Launch Arrow Icon on right -->
  <path d="M96 35 L106 35 L106 45 M106 35 L88 53" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M96 63 L106 63 L106 73 M106 63 L88 81" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
