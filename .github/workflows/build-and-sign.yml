name: Firefox Extensions CI & Sign

on:
  push:
    branches:
      - main
    tags:
      - '*/*' # e.g. firefoxAllowPastingExtension/v1.0.0 or v*

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  lint-and-build:
    name: Build & Check Extensions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension:
          - firefoxAllowPastingExtension
          - firefoxOpenUrlsInContainerExtension

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download & Cryptographically Verify web-ext
        run: |
          curl -sSL -o web-ext.tgz https://registry.npmjs.org/web-ext/-/web-ext-10.1.0.tgz
          node -e '
          const fs = require("fs");
          const crypto = require("crypto");
          const hash = crypto.createHash("sha512").update(fs.readFileSync("web-ext.tgz")).digest("base64");
          const expected = "E3OhwIBK3Xwh28xqB9DvMw4t0ESqqKa6DgVGIHiwEAhYMJautBJbUM010ddy5FFOZ2VeODzhTPR3MCUBG8ECaA==";
          if (hash !== expected) {
            console.error("❌ Cryptographic verification failed!");
            process.exit(1);
          }
          console.log("✅ Cryptographic integrity verified successfully!");
          '
          npm install -g ./web-ext.tgz

      - name: Lint Extension
        run: |
          cd ${{ matrix.extension }}
          web-ext lint

      - name: Build Extension Package (.zip)
        run: |
          cd ${{ matrix.extension }}
          web-ext build --overwrite-dest

      - name: Sign & Release Extension
        if: startsWith(github.ref, 'refs/tags/') && secrets.FIREFOX_API_KEY != ''
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ${{ matrix.extension }}
          web-ext sign --source-dir=. --channel=unlisted
          XPI_FILE=$(ls web-ext-artifacts/*.xpi | head -n 1)
          cp "$XPI_FILE" "./${{ matrix.extension }}.xpi"
          gh release create "${{ github.ref_name }}" "./${{ matrix.extension }}.xpi" \
            --title "${{ matrix.extension }} ${{ github.ref_name }}" \
            --notes "Automated release of signed Firefox extension for ${{ matrix.extension }}" || true
