name: Firefox Allow Pasting Extension CI & Release

on:
  push:
    branches:
      - main
    paths:
      - 'firefoxAllowPastingExtension/**'
      - '.github/workflows/firefox-allow-pasting.yml'
    tags:
      - 'firefoxAllowPastingExtension/*'
      - 'firefoxAllowPastingExtension-v*'
  pull_request:
    branches:
      - main
    paths:
      - 'firefoxAllowPastingExtension/**'
      - '.github/workflows/firefox-allow-pasting.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-lint-sign:
    name: Build & Sign Extension
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download & Cryptographically Verify web-ext
        run: |
          curl -sSL -o web-ext.tgz https://registry.npmjs.org/web-ext/-/web-ext-10.1.0.tgz
          node -e '
          const fs = require("fs");
          const crypto = require("crypto");
          const hash = crypto.createHash("sha512").update(fs.readFileSync("web-ext.tgz")).digest("base64");
          const expected = "E3OhwIBK3Xwh28xqB9DvMw4t0ESqqKa6DgVGIHiwEAhYMJautBJbUM010ddy5FFOZ2VeODzhTPR3MCUBG8ECaA==";
          if (hash !== expected) {
            console.error("❌ Cryptographic verification failed!");
            process.exit(1);
          }
          console.log("✅ Cryptographic integrity verified successfully!");
          '
          npm install -g ./web-ext.tgz

      - name: Lint Extension
        working-directory: firefoxAllowPastingExtension
        run: web-ext lint

      - name: Sign Extension
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: firefoxAllowPastingExtension
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
          TAG: ${{ github.ref_name }}
        run: |
          # Dynamically set manifest.json version to match the tag name
          node -e '
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const tag = process.env.TAG;
          const version = tag.replace(/^.*[-/]v?/, "").replace(/^v/, "");
          manifest.version = version;
          fs.writeFileSync("manifest.json", JSON.stringify(manifest, null, 2));
          console.log(`Updated manifest.json version to: ${version}`);
          '

          # Sign the extension as an unlisted add-on
          web-ext sign --source-dir=. --channel=unlisted

          # Copy to a clean standard name for release asset upload
          cp web-ext-artifacts/*.xpi ./firefoxAllowPastingExtension.xpi

      - name: Attest Extension
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: 'firefoxAllowPastingExtension/firefoxAllowPastingExtension.xpi'

      - name: Create GitHub Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: firefoxAllowPastingExtension
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the release
          gh release create "${{ github.ref_name }}" firefoxAllowPastingExtension.xpi \
            --title "${{ github.ref_name }}" \
            --notes "Automated release of signed Firefox extension firefoxAllowPastingExtension.xpi for version ${{ github.ref_name }}"
