<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="clipboardGradOff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="paperGradOff" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <!-- Clipboard Board -->
  <rect x="6" y="8" width="20" height="20" rx="3" fill="none" stroke="url(#clipboardGradOff)" stroke-width="2.5" />
  
  <!-- Paper Sheet -->
  <rect x="9" y="12" width="14" height="13" rx="1.5" fill="url(#paperGradOff)" stroke="#94A3B8" stroke-width="1.5" />
  
  <!-- Clip (on top) -->
  <path d="M12 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" fill="none" stroke="url(#clipboardGradOff)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Content Lines on Paper -->
  <line x1="12" y1="16" x2="20" y2="16" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />
  <line x1="12" y1="20" x2="17" y2="20" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- "Inactive" badge -->
  <circle cx="24" cy="24" r="5" fill="#64748B" stroke="#FFFFFF" stroke-width="1.5" />
  <path d="M22 24h4" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
