name: Sign Firefox Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Lint JavaScript
        run: |
          npx jshint background.js content.js

      - name: Download & Cryptographically Verify web-ext
        run: |
          # Download target web-ext version tarball from npm registry
          curl -sSL -o web-ext.tgz https://registry.npmjs.org/web-ext/-/web-ext-10.1.0.tgz

          # Cryptographically verify the SHA512 hash integrity
          node -e '
          const fs = require("fs");
          const crypto = require("crypto");
          const hash = crypto.createHash("sha512").update(fs.readFileSync("web-ext.tgz")).digest("base64");
          const expected = "E3OhwIBK3Xwh28xqB9DvMw4t0ESqqKa6DgVGIHiwEAhYMJautBJbUM010ddy5FFOZ2VeODzhTPR3MCUBG8ECaA==";
          if (hash !== expected) {
            console.error("❌ Cryptographic verification failed!");
            console.error("Expected:", expected);
            console.error("Got:", hash);
            process.exit(1);
          }
          console.log("✅ Cryptographic integrity verified successfully!");
          console.log("Expected SHA512:", expected);
          console.log("Computed SHA512:", hash);
          '

          # Install from verified tarball
          npm install -g ./web-ext.tgz

      - name: Sign Extension
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
          TAG: ${{ github.ref_name }}
        run: |
          # Dynamically set manifest.json version to match the tag name (stripping leading "v")
          node -e '
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const tag = process.env.TAG;
          const version = tag.replace(/^v/, "");
          manifest.version = version;
          fs.writeFileSync("manifest.json", JSON.stringify(manifest, null, 2));
          console.log(`Updated manifest.json version to: ${version}`);
          '

          # Sign the extension as an unlisted add-on
          web-ext sign --source-dir=. --channel=unlisted

          # Copy to a clean standard name for release asset upload
          cp web-ext-artifacts/*.xpi ./force-paste.xpi

      - name: Attest Extension
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: 'force-paste.xpi'

      - name: Create GitHub Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the release
          gh release create "${{ github.ref_name }}" force-paste.xpi \
            --title "${{ github.ref_name }}" \
            --notes "Automated release of signed Firefox extension force-paste.xpi for version ${{ github.ref_name }}"
